defaults:
  - identify_associations_bayes

batch_size: 30

num_refits: 30

target_dataset: arivale.run.polygenic
target_value: 1
save_refits: True

model:
  categorical_weights: ${weights:${data.categorical_inputs}}
  continuous_weights: ${weights:${data.continuous_inputs}}
  num_hidden:
    - 2000
  num_latent: 200
  beta: 0.0001
  dropout: 0.1 
  cuda:  false

training_loop:
  lr: 1e-4
  num_epochs: 800
  kld_warmup_steps: [200]  # Warmup period for KLD loss
  batch_dilation_steps: [100]  # Increase batch size after 100 epochs
  early_stopping: true       # Enable early stopping
  patience: 10 

